<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<!-- The drawing is someone else's file: only this page's own script runs
		     (not the drawing's <script>s or onload/onclick handlers), and nothing
		     loads from the network. Images and fonts may be embedded as data. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'nonce-CANVAS_NONCE'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:"
		/>
		<meta name="color-scheme" content="light dark" />
		<style id="base">
			/* canvas.css */
		</style>
		<style id="size"></style>
	</head>
	<body class="checkerboard">
		<div id="host"></div>
		<div id="minimap" aria-hidden="true">
			<div id="mini-frame">
				<img id="mini-img" alt="" />
				<div id="mini-view"></div>
				<div id="mini-zoom"></div>
			</div>
		</div>
		<div id="hover" class="box"></div>
		<input id="text-editor" type="text" spellcheck="false" />
		<div id="doc" class="box">
			<div class="knob" data-doc="nw" style="left: 0; top: 0"></div>
			<div class="knob edge" data-doc="n" style="left: 50%; top: 0"></div>
			<div class="knob" data-doc="ne" style="left: 100%; top: 0"></div>
			<div class="knob edge" data-doc="e" style="left: 100%; top: 50%"></div>
			<div class="knob" data-doc="se" style="left: 100%; top: 100%"></div>
			<div class="knob edge" data-doc="s" style="left: 50%; top: 100%"></div>
			<div class="knob" data-doc="sw" style="left: 0; top: 100%"></div>
			<div class="knob edge" data-doc="w" style="left: 0; top: 50%"></div>
			<div id="doc-size"></div>
		</div>
		<div id="sel" class="box">
			<div class="stem"></div>
			<div class="knob rotate" data-handle="rot" title="Rotate (Shift snaps to 15°)"></div>
			<div class="knob" data-handle="nw" style="left: 0; top: 0"></div>
			<div class="knob edge" data-handle="n" style="left: 50%; top: 0"></div>
			<div class="knob" data-handle="ne" style="left: 100%; top: 0"></div>
			<div class="knob edge" data-handle="e" style="left: 100%; top: 50%"></div>
			<div class="knob" data-handle="se" style="left: 100%; top: 100%"></div>
			<div class="knob edge" data-handle="s" style="left: 50%; top: 100%"></div>
			<div class="knob" data-handle="sw" style="left: 0; top: 100%"></div>
			<div class="knob edge" data-handle="w" style="left: 0; top: 50%"></div>
		</div>
		<script nonce="CANVAS_NONCE">
			// canvas.js
		</script>
	</body>
</html>
